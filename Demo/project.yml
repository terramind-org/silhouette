# The demo app. Generate the Xcode project with `xcodegen generate` in this folder.
name: SilhouetteDemo
options:
  bundleIdPrefix: org.terramind
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Silhouette:
    path: ..
targets:
  SilhouetteDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [SilhouetteDemo]
    dependencies:
      - package: Silhouette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.terramind.silhouette.demo
        PRODUCT_NAME: SilhouetteDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Silhouette
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  SilhouetteDemo:
    build:
      targets:
        SilhouetteDemo: all
    run:
      config: Debug
